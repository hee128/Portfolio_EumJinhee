<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한국금융주택공사</title>
    <link rel="stylesheet" href="한국금융주택공사.css">
    <script src="https://kit.fontawesome.com/4ec79785b5.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="left">
            <h3>HF 한국 주택금융공사</h3>
            <h2>인터넷 금융서비스</h2>
        </div>
        <div class="right">
            <div class="up">
                <ul>
                    <li><a href="#">[보금자리론 신청방법]</a></li>
                    <li><a href="#">[주택연금 신청방법]</a></li>
                    <li><a href="#">[반환보증이행 신청방법]</a></li>
                    <li><input type="button" value="로그인" class="btn"></li>
                    <li><input type="button" value="인증/보안" class="btn"></li>
                </ul>
            </div>
            <div class="down">
                <div>
                <ul>
                    <li><a href="#">My HF</a></li>
                    <li><a href="#">신청</a></li>
                    <li><a href="#">간편 서류제출</a></li>
                    <li><a href="#">고객서비스</a></li>
                </ul>
                </div>
                <div class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-solid fa-book"></i>
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </div>
      </header>
      <hr>
      <main>
        <h2>국민과 함께 성장하는 <span class="global">글로벌</span> 주택금융 리더</h2>
        <div class="card">
          <div>
            <h3><span>아낌e-보금자리론</span></h3>
            <p>0.1%p 더 저렴한 금리</p>
            <h4>최대</h4>
            <h3>주택가격 6억원</h3>
            <img src="../images/ko1.png" alt="">
          </div>
          <div>
            <h3><span>u-보금자리론</span></h3>
            <p>우리 가족의 소중한 보금자리 마련</p>
            <h4>최대</h4>
            <h3>대출한도 3.6억원</h3>
             <img src="../images/ko2.png" alt="">
          </div>
          <div>
            <h3><span>내집마련 디딤돌</span></h3>
            <p>내 집 마련 꿈의 실현</p>
            <h>무주택 세대주 대상</h4>
            <h3>저금리<br>주택구입자금 대출</h3>
             <img src="../images/ko3.png" alt="">
          </div>
        </div>
      </main>
    </div>
